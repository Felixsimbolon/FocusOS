[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusos-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<0.29",
    "pydantic>=2.10,<3",
    "supabase==2.31.0",
    "tzdata>=2025.1",
]

[tool.setuptools.packages.find]
where = ["src"]
