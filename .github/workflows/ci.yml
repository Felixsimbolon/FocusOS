name: FocusOS checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix web
      - run: python -m pip install -e ./backend
      - run: npm run test:api
      - run: npm run test:web
      - run: python -m unittest discover -s evals -p 'test_*.py' -v
      - run: python evals/validate.py
      - run: python evals/run.py --dry-run
      - run: python evals/score.py
      - run: python evals/safety_gate.py
      - run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          FOCUSOS_APP_URL: http://localhost:3000
          FOCUSOS_API_URL: http://127.0.0.1:8000
