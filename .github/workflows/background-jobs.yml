name: Resume FocusOS jobs
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: focusos-background-jobs
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FOCUSOS_WORKER_SECRET: ${{ secrets.FOCUSOS_WORKER_SECRET }}
      FOCUSOS_API_URL: ${{ vars.FOCUSOS_API_URL }}
    steps:
      - name: Report setup needed
        if: env.FOCUSOS_WORKER_SECRET == '' || env.FOCUSOS_API_URL == ''
        run: echo "Worker scheduler is disabled until its secret and API URL are configured."
      - uses: actions/checkout@v4
        if: env.FOCUSOS_WORKER_SECRET != '' && env.FOCUSOS_API_URL != ''
      - uses: actions/setup-python@v5
        if: env.FOCUSOS_WORKER_SECRET != '' && env.FOCUSOS_API_URL != ''
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<0.29'
        if: env.FOCUSOS_WORKER_SECRET != '' && env.FOCUSOS_API_URL != ''
      - run: python scripts/work_jobs.py --max-steps 20
        if: env.FOCUSOS_WORKER_SECRET != '' && env.FOCUSOS_API_URL != ''
